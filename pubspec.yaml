name: we_workshop_monitor
description: Wallpaper Engine Steam Workshop Creator Monitor & Local Backup Desktop Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  dio: ^5.7.0
  html: ^0.15.5
  crypto: ^3.0.6
  ffi: ^2.2.0
  archive: ^4.0.2
  flutter_secure_storage: ^9.2.2
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# sqlite3_flutter_libs builds and bundles SQLite with the desktop application.
# Reuse that library instead of downloading another binary from GitHub.
hooks:
  user_defines:
    sqlite3:
      source: system
